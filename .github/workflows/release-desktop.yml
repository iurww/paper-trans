name: Release Packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            script: linux:build:deb
          - os: macos-15
            platform: macos-arm64
            script: mac:build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate tag and synchronize application version
        run: node tools/release-version.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev librsvg2-dev patchelf libfuse2 file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build desktop packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run ${{ matrix.script }} -- --ci -- --locked
      - name: Sign Debian updater package
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          npx tauri signer sign --app-version "$VERSION" src-tauri/target/release/bundle/deb/*.deb
      - name: Collect packages
        shell: bash
        run: |
          mkdir release-assets
          if [[ "$RUNNER_OS" == Linux ]]; then
            cp src-tauri/target/release/bundle/deb/*.deb release-assets/
            cp src-tauri/target/release/bundle/deb/*.deb.sig release-assets/
          else
            cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz release-assets/
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig release-assets/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PaperLens-${{ github.ref_name }}-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare the same toolchain used by local AppImage builds
        uses: docker/build-push-action@v6
        with:
          context: packaging/linux
          file: packaging/linux/Dockerfile.appimage
          tags: paperlens-appimage:ubuntu22
          load: true
          cache-from: type=gha,scope=appimage-toolchain
          cache-to: type=gha,mode=max,scope=appimage-toolchain
      - name: Build signed AppImage in the locally verified toolchain
        env:
          PAPERLENS_TOOLCHAIN_READY: '1'
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash tools/build-appimage-docker.sh "$PWD/release-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: PaperLens-${{ github.ref_name }}-appimage-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm rust pkgconf gtk3 webkit2gtk-4.1 openssl librsvg
      - uses: actions/checkout@v4
      - name: Synchronize release version
        run: node tools/release-version.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - name: Build native Arch executable
        run: npm run linux:build:arch -- --ci -- --locked
      - name: Build pacman package
        shell: bash
        run: |
          npm run linux:package:arch
          useradd --create-home packager
          chown -R packager:packager src-tauri/target/release/bundle/arch/work
          cd src-tauri/target/release/bundle/arch/work
          runuser -u packager -- env PKGEXT=.pkg.tar.zst makepkg --noconfirm --cleanbuild
          pacman -Qip ./*.pkg.tar.zst
          pacman -Qlp ./*.pkg.tar.zst
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/release-assets/"
      - uses: actions/upload-artifact@v4
        with:
          name: PaperLens-${{ github.ref_name }}-archlinux-x86_64
          path: release-assets/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  android:
    # Desktop releases are independent; Android remains disabled until its SDK setup is fixed.
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Synchronize release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/release-version.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - run: npm run android:build
      - name: Collect installable debug APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/PaperLens-${RELEASE_TAG}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PaperLens-${{ github.ref_name }}-android
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, appimage, arch]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: PaperLens-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true
      - name: Verify desktop package set
        shell: bash
        run: |
          cd release-assets
          shopt -s nullglob
          debs=(*.deb)
          appimages=(*.AppImage)
          dmgs=(*.dmg)
          archs=(*.pkg.tar.zst)
          [[ ${#debs[@]} == 1 && ${#appimages[@]} == 1 && ${#dmgs[@]} == 1 && ${#archs[@]} == 1 ]]
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "PaperLens $RELEASE_TAG" --generate-notes --draft
          fi
          gh release view "$RELEASE_TAG" --json tagName,name,body,publishedAt > release-metadata.json
          node tools/updater-manifest.mjs release-assets "$GH_REPO" release-metadata.json
          (cd release-assets && sha256sum *.deb *.AppImage *.dmg *.pkg.tar.zst *.app.tar.gz *.sig latest.json appimage-runtime.json > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
