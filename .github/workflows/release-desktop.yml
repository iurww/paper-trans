name: Release Packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            script: linux:build
          - os: macos-15
            platform: macos-arm64
            script: mac:build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate tag and synchronize application version
        run: node tools/release-version.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev librsvg2-dev patchelf libfuse2 file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build desktop packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run ${{ matrix.script }} -- --ci -- --locked
      - name: Sign Debian updater package
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          npx tauri signer sign --app-version "$VERSION" src-tauri/target/release/bundle/deb/*.deb
      - name: Collect packages
        shell: bash
        run: |
          mkdir release-assets
          if [[ "$RUNNER_OS" == Linux ]]; then
            cp src-tauri/target/release/bundle/deb/*.deb release-assets/
            cp src-tauri/target/release/bundle/deb/*.deb.sig release-assets/
            cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig release-assets/
          else
            cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz release-assets/
            cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig release-assets/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PaperLens-${{ github.ref_name }}-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Synchronize release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/release-version.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - run: npm run android:build
      - name: Collect installable debug APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/PaperLens-${RELEASE_TAG}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PaperLens-${{ github.ref_name }}-android
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: PaperLens-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true
      - name: Verify package set and generate checksums
        shell: bash
        run: |
          cd release-assets
          shopt -s nullglob
          debs=(*.deb)
          appimages=(*.AppImage)
          dmgs=(*.dmg)
          apks=(*.apk)
          [[ ${#debs[@]} == 1 && ${#appimages[@]} == 1 && ${#dmgs[@]} == 1 && ${#apks[@]} == 1 ]]
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "PaperLens $RELEASE_TAG" --generate-notes --draft
          fi
          gh release view "$RELEASE_TAG" --json tagName,name,body,publishedAt > release-metadata.json
          node tools/updater-manifest.mjs release-assets "$GH_REPO" release-metadata.json
          (cd release-assets && sha256sum *.deb *.AppImage *.dmg *.apk *.app.tar.gz *.sig latest.json > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
