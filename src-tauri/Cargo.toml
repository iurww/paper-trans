[package]
name = "paperlens"
version = "0.3.3"
description = "PaperLens desktop PDF translation workbench"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
log = "0.4"
serde_json = "1"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
